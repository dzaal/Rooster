<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Palletstage 3D Viewer (Babylon.js)</title>
<style>
  html,body { margin:0; height:100%; background:#0b0b0b; color:#eee; font-family:system-ui,Segoe UI,Inter,Arial; }
  #renderCanvas { width:100%; height:100%; display:block; outline:none; }
  .ui {
    position:fixed; top:12px; left:12px; z-index:10;
    background:#111a; border:1px solid #333; border-radius:10px; padding:10px 12px; font-size:13px; line-height:1.4;
    backdrop-filter: blur(6px);
  }
  .ui h1 { margin:0 0 6px 0; font-size:14px; color:#ffe066; }
  .row { display:flex; gap:8px; flex-wrap:wrap; margin-top:6px; }
  label { display:flex; align-items:center; gap:6px; }
  button { background:#232323; color:#eee; border:1px solid #444; border-radius:8px; padding:6px 10px; cursor:pointer; }
  button:hover { background:#2d2d2d; }
  .legend {
    position:fixed; right:12px; bottom:12px; z-index:10;
    background:#111a; border:1px solid #333; border-radius:10px; padding:8px 10px; font-size:12px; color:#ccc;
  }
</style>
</head>
<body>
<canvas id="renderCanvas" tabindex="0"></canvas>

<div class="ui">
  <h1>Palletstage • Parknest</h1>
  <div class="row">
    <label><input type="checkbox" id="chkPlanters" checked> Plantenbakken</label>
    <label><input type="checkbox" id="chkPergola"  checked> Pergola</label>
    <label><input type="checkbox" id="chkRoof"     checked> Dak</label>
    <label><input type="checkbox" id="chkIvy"      checked> Ivy/Klimop</label>
    <label><input type="checkbox" id="chkSpeakers" checked> Speakers/Lichtbalk</label>
    <label><input type="checkbox" id="chkHead"     checked> Kachel-kop</label>
  </div>
  <div class="row" style="margin-top:8px">
    <button id="btnReset">Reset camera</button>
    <button id="btnFrame">Frame model</button>
  </div>
</div>

<div class="legend">
  Sleep: orbit • Scroll: zoom • Ctrl/Alt+Sleep: pannen
</div>

<!-- Babylon.js (UMD, geen modules) -->
<script src="https://cdn.babylonjs.com/babylon.js"></script>
<script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>

<script>
(function(){
  const canvas = document.getElementById('renderCanvas');
  const engine = new BABYLON.Engine(canvas, true, { preserveDrawingBuffer:true, stencil:true });
  const scene  = new BABYLON.Scene(engine);
  scene.clearColor = new BABYLON.Color4(0.043, 0.043, 0.043, 1);

  // ArcRotate (orbit) camera
  const target = new BABYLON.Vector3(1.5, 0.25, 1.0); // midden van deck
  const camera = new BABYLON.ArcRotateCamera("cam",
      -Math.PI/4, Math.PI/3, 5.0, target, scene);
  camera.lowerRadiusLimit = 1.2;
  camera.upperRadiusLimit = 30;
  camera.wheelPrecision = 40;     // trager zoomen
  camera.panningSensibility = 100; // pannen snelheid
  camera.attachControl(canvas, true);

  // Lights
  new BABYLON.HemisphericLight("hemi", new BABYLON.Vector3(0,1,0), scene);
  const dir = new BABYLON.DirectionalLight("dir", new BABYLON.Vector3(-0.6,-1,-0.4), scene);
  dir.position = new BABYLON.Vector3(6,6,4);

  // Environment (zachte reflecties)
  scene.createDefaultEnvironment({
    createSkybox: false,
    createGround: false
  });

  // Groups by name substring
  const groups = {
    planters: [],
    pergola:  [],
    roof:     [],
    ivy:      [],
    speakers: [],
    head:     [],
    other:    []
  };

  function classifyMesh(m){
    const n = (m.name || "").toLowerCase();
    if (n.includes("planter"))                    groups.planters.push(m);
    else if (n.includes("pergola") || n.includes("post") || n.includes("beam") || n.includes("rafter"))
                                                 groups.pergola.push(m);
    else if (n.includes("roof"))                 groups.roof.push(m);
    else if (n.includes("ivy"))                  groups.ivy.push(m);
    else if (n.includes("speaker") || n.includes("lightbar"))
                                                 groups.speakers.push(m);
    else if (n.includes("head") || n.includes("pole") || n.includes("pipe"))
                                                 groups.head.push(m);
    else                                          groups.other.push(m);
  }

  // Load GLB (place palletstage.glb next to this HTML)
  BABYLON.SceneLoader.Append("", "palletstage.glb", scene, function() {
    // Classify all loaded meshes once
    scene.meshes.forEach(m => { if (m && m.name) classifyMesh(m); });
    frameModel(); // auto frame once loaded
  }, null, function(scene, msg, err) {
    console.error("GLB load error:", msg, err || "");
  });

  // Toggle helpers
  function setVisible(list, vis){
    for (const m of list) {
      if (!m) continue;
      m.setEnabled(vis); // more robust than isVisible for hierarchies
    }
  }

  // UI bindings
  const $ = id => document.getElementById(id);
  $('chkPlanters').addEventListener('change', e => setVisible(groups.planters, e.target.checked));
  $('chkPergola' ).addEventListener('change', e => setVisible(groups.pergola,  e.target.checked));
  $('chkRoof'    ).addEventListener('change', e => setVisible(groups.roof,     e.target.checked));
  $('chkIvy'     ).addEventListener('change', e => setVisible(groups.ivy,      e.target.checked));
  $('chkSpeakers').addEventListener('change', e => setVisible(groups.speakers, e.target.checked));
  $('chkHead'    ).addEventListener('change', e => setVisible(groups.head,     e.target.checked));

  $('btnReset').addEventListener('click', () => {
    camera.setTarget(target);
    camera.alpha = -Math.PI/4;
    camera.beta  = Math.PI/3;
    camera.radius = 5.0;
  });

  $('btnFrame').addEventListener('click', frameModel);

  function getMeshesBounds(meshes) {
    let min = new BABYLON.Vector3(Number.POSITIVE_INFINITY, Number.POSITIVE_INFINITY, Number.POSITIVE_INFINITY);
    let max = new BABYLON.Vector3(Number.NEGATIVE_INFINITY, Number.NEGATIVE_INFINITY, Number.NEGATIVE_INFINITY);
    let count = 0;
    for (const m of meshes) {
      if (!m || !m.getBoundingInfo) continue;
      const b = m.getBoundingInfo().boundingBox;
      min = BABYLON.Vector3.Minimize(min, b.minimumWorld);
      max = BABYLON.Vector3.Maximize(max, b.maximumWorld);
      count++;
    }
    if (count === 0) return null;
    return { min, max, center: min.add(max).scale(0.5), size: max.subtract(min) };
  }

  function frameModel() {
    // frame all visible meshes
    const visible = scene.meshes.filter(m => m && m.isEnabled() && m.getTotalVertices && m.getTotalVertices() > 0);
    const bounds = getMeshesBounds(visible);
    if (!bounds) return;
    const { center, size } = bounds;
    camera.setTarget(center);

    const radius = Math.max(size.x, size.y, size.z) * 0.8 + 2.0; // pad
    // keep beta within limits
    camera.beta  = BABYLON.Scalar.Clamp(camera.beta, 0.05, Math.PI - 0.05);
    camera.radius = Math.min(Math.max(radius, 2.0), 20.0);
  }

  // Render loop
  engine.runRenderLoop(() => scene.render());
  window.addEventListener('resize', () => engine.resize());
})();
</script>
</body>
</html>
